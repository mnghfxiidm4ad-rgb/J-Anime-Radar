name: Daily seasonal update

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Detect new episodes, summarize, rebuild docs/
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SITE_URL: ${{ vars.SITE_URL }}
          GOOGLE_FORM_EMBED_URL: ${{ secrets.GOOGLE_FORM_EMBED_URL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          TZ: Asia/Tokyo
        run: python scripts/fetch_and_summarize.py --max-new 12

      - name: Commit and push if the desk moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then
            echo "No site changes."
          else
            git commit -m "chore: publish new seasonal episode intel"
            git push
          fi
