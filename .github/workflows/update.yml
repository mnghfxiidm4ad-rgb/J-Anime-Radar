name: Daily seasonal update

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Detect new episodes, summarize, fill shortfall, rebuild docs/
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SITE_URL: ${{ vars.SITE_URL }}
          GOOGLE_FORM_EMBED_URL: ${{ secrets.GOOGLE_FORM_EMBED_URL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          DAILY_TARGET_COUNT: ${{ vars.DAILY_TARGET_COUNT }}
          SUPPLEMENT_LOOKBACK_DAYS: ${{ vars.SUPPLEMENT_LOOKBACK_DAYS }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_STATUS: ${{ vars.WP_STATUS }}
          WP_CATEGORY_EPISODE: ${{ vars.WP_CATEGORY_EPISODE }}
          WP_CATEGORY_FEATURE: ${{ vars.WP_CATEGORY_FEATURE }}
          WP_TAG_IDS: ${{ vars.WP_TAG_IDS }}
          WP_GENRE_MEDIA_ACTION: ${{ vars.WP_GENRE_MEDIA_ACTION }}
          WP_GENRE_MEDIA_SF: ${{ vars.WP_GENRE_MEDIA_SF }}
          WP_GENRE_MEDIA_ROMANCE: ${{ vars.WP_GENRE_MEDIA_ROMANCE }}
          WP_GENRE_MEDIA_SLICE_OF_LIFE: ${{ vars.WP_GENRE_MEDIA_SLICE_OF_LIFE }}
          WP_GENRE_MEDIA_COMEDY: ${{ vars.WP_GENRE_MEDIA_COMEDY }}
          WP_GENRE_MEDIA_FANTASY: ${{ vars.WP_GENRE_MEDIA_FANTASY }}
          WP_GENRE_MEDIA_DEFAULT: ${{ vars.WP_GENRE_MEDIA_DEFAULT }}
          TZ: Asia/Tokyo
        run: python scripts/fetch_and_summarize.py --max-new 3 --no-seed-extra

      - name: Commit and push if the desk moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          if git diff --cached --quiet; then
            echo "No site changes."
          else
            git commit -m "chore: publish daily radar posts"
            git push
          fi
